const LS_KEY = 'TRIP_HUB_DATA';

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return defaultState();
    const saved = JSON.parse(raw);
    return Object.assign(defaultState(), saved);
  } catch (e) { return defaultState(); }
}
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
}

/* =====================================================================
   HELPERS
   ===================================================================== */
const $ = sel => document.querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const TRIP_START = new Date(TRIP[0].date + 'T00:00:00');
const TRIP_END = new Date(TRIP[TRIP.length - 1].date + 'T23:59:59');

function todayMidnight() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }

// Which trip day is "current"? Clamp to trip range for demo/preview.
function currentTripDay() {
  const now = todayMidnight();
  if (now < TRIP_START) return null;            // before trip
  if (now > TRIP_END) return 'over';            // after trip
  const idx = daysBetween(TRIP_START, now);
  return TRIP[Math.min(idx, TRIP.length - 1)];
}

function cityCardClass(phase) { return CITY_CELL[phase] || 'bg-stone-100 text-stone-700'; }

function applyChrome() {
  document.documentElement.classList.toggle('dark', !!state.dark);
  const fsMap = { sm:'fs-sm', base:'', lg:'fs-lg', xl:'fs-xl' };
  document.documentElement.classList.remove('fs-sm','fs-lg','fs-xl');
  if (fsMap[state.fontScale]) document.documentElement.classList.add(fsMap[state.fontScale]);
}

function headerCountdown() {
  const now = todayMidnight();
  const el = $('#hdrCountdown');
  if (!el) return;
  if (now < TRIP_START) {
    const d = daysBetween(now, TRIP_START);
    el.textContent = d === 0 ? 'Tomorrow!' : `${d} days to go`;
  } else if (now > TRIP_END) {
    el.textContent = 'Trip complete ✓';
  } else {
    const cd = currentTripDay();
    el.textContent = cd && cd !== 'over' ? `Day ${cd.day} of ${TRIP.length}` : `In trip`;
  }
}

/* =====================================================================
   WEATHER (open-meteo, no key). Shows climate normals; live if in range.
   ===================================================================== */
async function weatherFor(cityName) {
  const climate = JUNE_CLIMATE[cityName];
  const coords = CITY_COORDS[cityName];
  const base = climate
    ? `<span class="text-2xl">${climate.icon}</span> <span class="font-semibold">${climate.hi}° / ${climate.lo}°F</span> <span class="text-xs opacity-70">June normals · ${esc(climate.note)}</span>`
    : '';
  // Only attempt live if the trip is happening now (within ~7 days of dates).
  const now = todayMidnight();
  const within = now >= new Date(TRIP_START.getTime() - 7*86400000) && now <= new Date(TRIP_END.getTime() + 86400000);
  if (!within || !coords) return base;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${coords[0]}&longitude=${coords[1]}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`;
    const r = await fetch(url);
    const j = await r.json();
    if (j && j.current) {
      return `<span class="text-2xl">🌡️</span> <span class="font-semibold">${Math.round(j.current.temperature_2m)}°F now</span> <span class="text-xs opacity-70">live · ${esc(cityName)}</span>`;
    }
  } catch (e) {}
  return base;
}

/* =====================================================================
   VIEW: DAYS (list + calendar)
   ===================================================================== */
function renderCalendar() {
  // June 2026
  const year = 2026, month = 5; // 0-indexed: Jun
  const first = new Date(year, month, 1);
  const startDow = (first.getDay() + 6) % 7; // Monday-start offset
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const byDate = {};
  TRIP.forEach(t => { byDate[t.date] = t; });
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push('<div></div>');
  for (let dn = 1; dn <= daysInMonth; dn++) {
    const iso = `2026-06-${String(dn).padStart(2,'0')}`;
    const t = byDate[iso];
    if (t) {
      const cls = cityCardClass(t.phase);
      const marker = t.trainBooked ? '🚄' : t.flightPlaceholder ? '✈️' : '';
      cells.push(`<div class="aspect-square rounded-lg ${cls} flex flex-col items-center justify-center text-xs font-semibold relative">
        <span class="absolute top-1 left-1.5 text-[10px] opacity-70">${dn}</span>
        <span class="text-base leading-none">${esc(t.flag || '')}</span>
        <span class="text-[9px] mt-0.5">D${t.day}${marker}</span>
      </div>`);
    } else {
      cells.push(`<div class="aspect-square rounded-lg bg-stone-100 dark:bg-stone-800/40 flex items-start justify-start p-1.5 text-[10px] opacity-40">${dn}</div>`);
    }
  }
  const dows = ['M','T','W','T','F','S','S'];
  const legend = CITIES.map(c => `<span class="inline-flex items-center gap-1 text-[11px]"><span class="w-3 h-3 rounded ${cityCardClass(c.phase)}"></span>${esc(c.city)}</span>`).join('');
  return `
    <div class="bg-white dark:bg-stone-900 rounded-2xl shadow-sm border border-stone-200 dark:border-stone-800 p-4 mb-4 fade-in">
      <h3 class="font-display text-2xl mb-2">JUNE 2026</h3>
      <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-semibold opacity-50 mb-1">${dows.map(d=>`<div>${d}</div>`).join('')}</div>
      <div class="grid grid-cols-7 gap-1">${cells.join('')}</div>
      <div class="flex flex-wrap gap-x-3 gap-y-1 mt-3">${legend}</div>
    </div>`;
}

}

function guideShops(city) {
  const items = (SHOPS_BY_CITY[city] || []);
  if (!items.length) return `<p class="opacity-60 py-6 text-center">No shops listed yet.</p>`;
  return items.map(s => `
    <a href="${esc(s.url)}" target="_blank" rel="noopener" class="block bg-white dark:bg-stone-900 rounded-2xl border border-stone-200 dark:border-stone-800 p-4 mb-3 fade-in active:scale-[0.99] transition">
      <div class="flex items-start gap-3">
        <span class="text-2xl">${esc(s.icon)}</span>
        <div class="flex-1">
          <div class="flex items-center justify-between gap-2">
            <span class="font-serif font-semibold">${esc(s.name)}</span>
            ${badge(SHOP_CAT_LABEL[s.cat]||s.cat, 'bg-stone-100 text-stone-600 dark:bg-stone-800 dark:text-stone-300')}
          </div>
          <div class="text-[12px] opacity-60 mt-0.5">📍 ${esc(s.neighborhood)} · Day ${s.day}</div>
          ${s.note ? `<p class="text-[13px] mt-1 opacity-85 leading-snug">${esc(s.note)}</p>` : ''}
        </div>
      </div>
    </a>`).join('');
}

function guideFoods(city) {
  const items = (FOODS_BY_CITY[city] || []);
  if (!items.length) return `<p class="opacity-60 py-6 text-center">No foods listed yet.</p>`;
  return items.map(f => `
    <div class="bg-white dark:bg-stone-900 rounded-2xl border border-stone-200 dark:border-stone-800 p-4 mb-3 fade-in">
      <div class="flex items-start gap-3">
        <span class="text-2xl">${esc(f.emoji)}</span>
        <div class="flex-1">
          <div class="font-serif font-semibold">${esc(f.name)} <span class="text-[11px] font-sans opacity-50">· Day ${f.day}</span></div>
          <p class="text-[13px] mt-0.5 opacity-85 leading-snug">${esc(f.blurb)}</p>
          <p class="text-[12px] mt-1 opacity-60">🍽 ${esc(f.where)}</p>
        </div>
      </div>
    </div>`).join('');
}

function guideFine(city) {
  const items = (MICHELIN_BY_CITY[city] || []);
  if (!items.length) return `<p class="opacity-60 py-6 text-center">No picks yet.</p>`;
  return items.map(m => `
    <a href="${esc(m.url)}" target="_blank" rel="noopener" class="block bg-white dark:bg-stone-900 rounded-2xl border border-stone-200 dark:border-stone-800 p-4 mb-3 fade-in active:scale-[0.99] transition">
      <div class="flex items-center justify-between gap-2">
        <span class="font-serif font-semibold">${esc(m.name)}</span>
        ${m.stars ? badge('★'.repeat(m.stars)+' Michelin', 'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300') : badge('Local fave', 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300')}
      </div>
      <div class="text-[12px] opacity-60 mt-0.5">Day ${m.day} · ${m.bookWeeks ? 'book ~'+m.bookWeeks+'wk ahead' : 'no booking'}</div>
      ${m.kidNote ? `<p class="text-[13px] mt-1 opacity-85 leading-snug">👦 ${esc(m.kidNote)}</p>` : ''}
      ${m.note ? `<p class="text-[12px] mt-1 opacity-70 leading-snug">${esc(m.note)}</p>` : ''}
    </a>`).join('');
}

function guideTips(phase, city) {
  const cityDays = TRIP.filter(t => t.phase === phase).map(t => t.day);
  // bucket filter
  const bucketChips = ['all', ...Object.keys(BUCKETS)].map(b => `
    <button data-bucket="${b}" class="px-3 py-1 rounded-full text-xs font-medium ${state.tipBucket===b ? 'bg-stone-800 text-white dark:bg-white dark:text-stone-900' : 'bg-stone-100 dark:bg-stone-800'}">${b==='all'?'All':BUCKETS[b].icon+' '+BUCKETS[b].label}</button>`).join('');
  let tips = SEED_TIPS.filter(t => cityDays.includes(t.day));
  if (state.tipBucket !== 'all') tips = tips.filter(t => t.bucket === state.tipBucket);
  const list = tips.length ? tips.map((t, i) => {
    const key = `${city}-${t.day}-${i}-${t.title}`;
    const read = state.tipsRead[key];
    return `
    <div class="bg-white dark:bg-stone-900 rounded-2xl border border-stone-200 dark:border-stone-800 p-4 mb-3 fade-in ${read?'opacity-60':''}">
      <div class="flex items-center justify-between gap-2">
        <span class="text-[11px] font-semibold uppercase tracking-wide opacity-60">${BUCKETS[t.bucket].icon} ${BUCKETS[t.bucket].label} · Day ${t.day}</span>
        <button data-tipread="${esc(key)}" class="text-xs ${read?'text-emerald-600':'opacity-50'}">${read?'✓ read':'mark read'}</button>
      </div>
      <div class="font-serif font-semibold mt-1">${esc(t.title)}</div>
      <p class="text-[13px] mt-0.5 opacity-85 leading-snug">${esc(t.body)}</p>
      <div class="flex items-center gap-3 mt-1.5 text-[12px] opacity-60">
        ${t.neighborhood?`<span>📍 ${esc(t.neighborhood)}</span>`:''}
        ${t.url?`<a href="${esc(t.url)}" target="_blank" rel="noopener" class="text-sky-600 dark:text-sky-400">link ↗</a>`:''}
      </div>
    </div>`;
  }).join('') : `<p class="opacity-60 py-6 text-center">No tips in this filter.</p>`;
  return `<div class="flex gap-2 flex-wrap mb-3">${bucketChips}</div>${list}`;
}

function guideRoute(phase) {
  const r = SHOP_ROUTES[phase];
  if (!r) return `<p class="opacity-60 py-6 text-center">No route for this city.</p>`;
  const stopList = Object.values(r.stops).map((addr, i, arr) => `
    <li class="flex items-start gap-2 text-[13px]">
      <span class="shrink-0 w-5 h-5 rounded-full bg-stone-200 dark:bg-stone-700 text-[10px] flex items-center justify-center font-bold">${i+1}</span>
      <span>${esc(addr)}</span>
    </li>`).join('');
  return `
    <div class="bg-white dark:bg-stone-900 rounded-2xl border border-stone-200 dark:border-stone-800 p-4 fade-in">
      <h3 class="font-serif text-lg font-semibold">${esc(r.title)}</h3>
      <p class="text-[13px] opacity-75 mt-1">${esc(r.note)}</p>
      <ul class="mt-3 space-y-2">${stopList}</ul>
      <a href="${gmapsRoute(r.stops)}" target="_blank" rel="noopener" class="block text-center mt-4 py-2.5 rounded-xl bg-sky-600 text-white font-semibold active:scale-[0.99] transition">Open full route in Google Maps ↗</a>
    </div>
    <div class="bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800 rounded-2xl p-4 mt-3">
      <h4 class="font-semibold text-emerald-800 dark:text-emerald-300 text-sm">💶 Tax-free shopping (non-EU)</h4>
      <p class="text-[13px] mt-1 opacity-85 leading-snug">Spend over the local minimum (€70–155 depending on country) in one store and ask for a <b>Tax Free</b> form + receipt. Get it stamped at your final EU airport (Milan) before checking bags to claim the VAT refund (up to ~15%).</p>
    </div>`;
}

/* =====================================================================
   VIEW: NOTES (checklists, bookings, phrases)
   ===================================================================== */
function renderNotes() {
  const app = $('#app');
  app.innerHTML = `
    <h2 class="font-display text-2xl mb-3">NOTES</h2>
    ${checklistHTML('packing')}
    ${checklistHTML('pretrip')}
    ${bookingsHTML()}
    ${phrasesHTML()}`;
}

function checklistHTML(key) {
  const cl = state.checklists[key];
  const done = cl.items.filter(i => i.checked).length;
  const rows = cl.items.map((it, i) => `
    <label class="flex items-start gap-3 py-2 border-b border-stone-100 dark:border-stone-800 last:border-0 cursor-pointer">
      <input type="checkbox" data-check="${key}:${i}" ${it.checked?'checked':''} class="mt-1 w-5 h-5 rounded accent-sky-600 shrink-0">
      <span class="text-[14px] ${it.checked?'line-through opacity-50':''}">${esc(it.text)}</span>
    </label>`).join('');
  return `
    <div class="bg-white dark:bg-stone-900 rounded-2xl border border-stone-200 dark:border-stone-800 p-4 mb-4 fade-in">
      <div class="flex items-center justify-between mb-1">
        <h3 class="font-serif text-lg font-semibold">${esc(cl.title)}</h3>
        <span class="text-xs opacity-60">${done}/${cl.items.length}</span>
      </div>
      ${rows}
    </div>`;
}

function bookingsHTML() {
  const now = todayMidnight();
  const rows = BOOKINGS_CATALOG.slice().sort((a,b)=>a.forDay-b.forDay).map(b => {
    const done = !!state.bookingsDone[b.id];
    const dayObj = TRIP.find(t => t.day === b.forDay);
    const eventDate = dayObj ? new Date(dayObj.date + 'T00:00:00') : null;
    const bookBy = eventDate ? new Date(eventDate.getTime() - b.leadDays*86400000) : null;
    let urgency = '';
    if (!done && bookBy) {
      const dleft = daysBetween(now, bookBy);
      if (dleft < 0) urgency = badge('book NOW', 'bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-300');
      else if (dleft <= 7) urgency = badge(`book within ${dleft}d`, 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300');
      else urgency = badge(`by ${bookBy.toISOString().slice(0,10)}`, 'bg-stone-100 text-stone-600 dark:bg-stone-800 dark:text-stone-300');
    }
    return `
    <div class="flex items-start gap-3 py-2.5 border-b border-stone-100 dark:border-stone-800 last:border-0">
      <input type="checkbox" data-booking="${b.id}" ${done?'checked':''} class="mt-1 w-5 h-5 rounded accent-emerald-600 shrink-0">
      <div class="flex-1">
        <div class="flex items-center justify-between gap-2">
          <span class="text-[14px] font-medium ${done?'line-through opacity-50':''}">${esc(b.icon)} ${esc(b.title)}</span>
        </div>
        <div class="flex items-center gap-2 mt-1 flex-wrap">
          <span class="text-[11px] opacity-60">for Day ${b.forDay}</span>
          ${done ? badge('✓ booked','bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300') : urgency}
          <a href="${esc(b.url)}" target="_blank" rel="noopener" class="text-[12px] text-sky-600 dark:text-sky-400">book ↗</a>
        </div>
      </div>
    </div>`;
  }).join('');
  return `
    <div class="bg-white dark:bg-stone-900 rounded-2xl border border-stone-200 dark:border-stone-800 p-4 mb-4 fade-in">
      <h3 class="font-serif text-lg font-semibold mb-1">⏰ Time-critical bookings</h3>
      <p class="text-[12px] opacity-60 mb-2">Reminders count back from each day. Acropolis & Colosseum slots and the cheap train fares go fast — book early!</p>
      ${rows}
    </div>`;
}

function phrasesHTML() {
  const isGreek = state.phraseLang === 'greek';
  const list = (isGreek ? GREEK_PHRASES : ITALIAN_PHRASES).map(p => `
    <div class="py-2 border-b border-stone-100 dark:border-stone-800 last:border-0">
      <div class="flex items-baseline justify-between gap-2">
        <span class="font-serif font-semibold text-[15px]">${esc(p.loc)}</span>
        <span class="text-[12px] opacity-60 italic shrink-0">${esc(p.pron)}</span>
      </div>
      <div class="text-[13px] opacity-75">${esc(p.en)}</div>
    </div>`).join('');
  return `
    <div class="bg-white dark:bg-stone-900 rounded-2xl border border-stone-200 dark:border-stone-800 p-4 mb-4 fade-in">
      <div class="flex items-center justify-between mb-2">
        <h3 class="font-serif text-lg font-semibold">🗣️ Phrases</h3>
        <div class="flex gap-1 bg-stone-100 dark:bg-stone-800 rounded-full p-1">
          <button data-lang="greek" class="px-3 py-1 rounded-full text-xs font-medium ${isGreek?'bg-white dark:bg-stone-700 shadow':''}">🇬🇷 Greek</button>
          <button data-lang="italian" class="px-3 py-1 rounded-full text-xs font-medium ${!isGreek?'bg-white dark:bg-stone-700 shadow':''}">🇮🇹 Italian</button>
        </div>
      </div>
      ${list}
    </div>`;
}

/* =====================================================================
   VIEW: SETTINGS (no cloud sign-in — local only + export/import)
   ===================================================================== */
function renderSettings() {
  const app = $('#app');
  app.innerHTML = `
    <h2 class="font-display text-2xl mb-3">SETTINGS</h2>

    <div class="bg-white dark:bg-stone-900 rounded-2xl border border-stone-200 dark:border-stone-800 p-4 mb-4 fade-in">
      <div class="flex items-center justify-between py-2">
        <span class="font-medium">🌙 Dark mode</span>
        <button id="toggleDark" class="w-12 h-7 rounded-full transition relative ${state.dark?'bg-sky-600':'bg-stone-300'}">
          <span class="absolute top-1 ${state.dark?'left-6':'left-1'} w-5 h-5 bg-white rounded-full transition-all"></span>
        </button>
      </div>
      <div class="py-2">
        <div class="font-medium mb-2">🔤 Text size</div>
        <div class="flex gap-2">
          ${['sm','base','lg','xl'].map(s=>`<button data-fs="${s}" class="flex-1 py-2 rounded-xl text-sm font-medium ${state.fontScale===s?'bg-sky-600 text-white':'bg-stone-100 dark:bg-stone-800'}">${({sm:'A−',base:'A',lg:'A+',xl:'A++'})[s]}</button>`).join('')}
        </div>
      </div>
    </div>

    <div class="bg-white dark:bg-stone-900 rounded-2xl border border-stone-200 dark:border-stone-800 p-4 mb-4 fade-in">
      <h3 class="font-serif text-lg font-semibold mb-1">💾 Your data</h3>
      <p class="text-[13px] opacity-70 mb-3">Everything (checklists, bookings) is stored <b>on this device only</b> — no account, no cloud. To move it to another phone, export here and import there.</p>
      <div class="flex gap-2">
        <button id="exportData" class="flex-1 py-2.5 rounded-xl bg-stone-800 text-white dark:bg-white dark:text-stone-900 font-semibold text-sm">⬇️ Export</button>
        <button id="importData" class="flex-1 py-2.5 rounded-xl bg-stone-100 dark:bg-stone-800 font-semibold text-sm">⬆️ Import</button>
      </div>
      <input id="importFile" type="file" accept="application/json" class="hidden">
      <button id="resetData" class="w-full mt-2 py-2.5 rounded-xl text-rose-600 font-medium text-sm">↺ Reset checklists & bookings</button>
    </div>

    <div class="bg-white dark:bg-stone-900 rounded-2xl border border-stone-200 dark:border-stone-800 p-4 mb-4 fade-in">
      <h3 class="font-serif text-lg font-semibold mb-1">📲 Install</h3>
      <p class="text-[13px] opacity-70">Add to your home screen for a full-screen, offline app: in Safari tap <b>Share → Add to Home Screen</b>; on Android use the browser menu → <b>Install app</b>.</p>
    </div>

    <p class="text-center text-[11px] opacity-40 mt-6 mb-2">Athens → Naples → Rome → Bologna → Milan · Sep 2026<br>Built for Kevin & son · static, offline-first, no tracking.</p>`;
}

/* =====================================================================
   ROUTER + EVENTS
   ===================================================================== */
function render() {
  applyChrome();
  headerCountdown();
  document.querySelectorAll('.nav-btn').forEach(b => {
    const active = b.dataset.nav === state.view;
    b.classList.toggle('text-sky-600', active);
    b.classList.toggle('dark:text-sky-400', active);
    b.classList.toggle('opacity-50', !active);
  });
  const v = state.view;
  if (v === 'today') renderToday();
  else if (v === 'days') renderDays();
  else if (v === 'guide') renderGuide();
  else if (v === 'notes') renderNotes();
  else if (v === 'settings') renderSettings();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-nav],[data-gcity],[data-gtab],[data-bucket],[data-lang],[data-fs],[data-tipread],#toggleDark,#exportData,#importData,#resetData');
  if (!t) return;

  if (t.dataset.nav) { state.view = t.dataset.nav; save(); render(); }
  else if (t.dataset.gcity) { state.guideCity = t.dataset.gcity; save(); renderGuide(); }
  else if (t.dataset.gtab) { state.guideTab = t.dataset.gtab; save(); renderGuide(); }
  else if (t.dataset.bucket) { state.tipBucket = t.dataset.bucket; save(); renderGuide(); }
  else if (t.dataset.lang) { state.phraseLang = t.dataset.lang; save(); renderNotes(); }
  else if (t.dataset.fs) { state.fontScale = t.dataset.fs; save(); render(); }
  else if (t.dataset.tipread) { const k = t.dataset.tipread; state.tipsRead[k] = !state.tipsRead[k]; save(); renderGuide(); }
  else if (t.id === 'toggleDark') { state.dark = !state.dark; save(); render(); }
  else if (t.id === 'exportData') { exportData(); }
  else if (t.id === 'importData') { $('#importFile').click(); }
  else if (t.id === 'resetData') { if (confirm('Reset all checklists and booking checkmarks? Your other settings stay.')) { state.checklists = JSON.parse(JSON.stringify(DEFAULT_CHECKLISTS)); state.bookingsDone = {}; state.tipsRead = {}; save(); render(); } }
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.check) {
    const [key, i] = t.dataset.check.split(':');
    state.checklists[key].items[+i].checked = t.checked;
    save();
    // update the count without full re-render flicker
    renderNotes();
  } else if (t.dataset && t.dataset.booking) {
    state.bookingsDone[t.dataset.booking] = t.checked;
    save(); renderNotes();
  } else if (t.id === 'importFile') {
    const file = t.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        state = Object.assign(defaultState(), data);
        save(); render();
        alert('Data imported ✓');
      } catch (err) { alert('Could not read that file.'); }
    };
    reader.readAsText(file);
  }
});

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'kevinitaly-trip-data.json';
  a.click();
  URL.revokeObjectURL(url);
}

/* ---------- PWA service worker ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* ---------- boot ---------- */
render();
</script>
</body>
</html>
